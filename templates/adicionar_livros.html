<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADICIONAR LIVRO | SGB</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

    <style>
        * { padding: 0; margin: 0; box-sizing: border-box; font-family: "Open sans", sans-serif; }
        body { min-height: 100vh; display: flex; flex-direction: column; }
        
        main { display: flex; flex-direction: column; align-items: center; }

        
        .sec-1 { margin-top: 40px; margin-bottom: 30px; width: 90%; }
        .sec-1 h1 { margin-bottom: 15px; color: rgb(3, 3, 71); }
        .sec-1 p { color: rgb(113, 113, 130); }
        .sec-1 a { text-decoration: none; color: rgb(74, 74, 255); font-weight: bold; margin-bottom: 10px; display: inline-block; }

        
        .form-container {
            margin-bottom: 50px;
            border: solid .8px rgb(3, 3, 71);
            padding: 30px;
            width: 90%;
            background-color: rgb(214, 232, 255);
            align-self: center;
        }

        .form-container h4 { padding: 0 0 20px 0; color: rgb(0, 0, 65); font-size: 1.2rem; }

        .input-group { margin-bottom: 20px; }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: rgb(0, 0, 65);
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid rgb(3, 3, 71);
            border-radius: 5px;
            outline: none;
        }

        
        .btn-salvar {
            width: 100%;
            background-color: rgb(3, 3, 71);
            color: white;
            border: none;
            border-radius: 10px;
            height: 40px;
            cursor: pointer;
            transition: all 0.6s ease;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-salvar:hover {
            background-color: white;
            color: rgb(3, 3, 71);
            border: 1px solid rgb(3, 3, 71);
        }
    </style>
</head>
<body>
    <main>
        <section class="sec-1">
            <a href="/home_page_adm"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
            <h1>Cadastrar Livro</h1>
            <p>Preencha os dados do novo livro para o acervo.</p>
        </section>

        <section class="form-container">
            <h4>Informações do Livro</h4>
            <form action="/rota_adicionar_livro" method="POST">
                <div class="input-group">
                    <label>Título</label>
                    <input type="text" name="titulo" required>
                </div>
                <div class="input-group">
                    <label>Autor</label>
                    <input type="text" name="autor" required>
                </div>
                <div class="input-group">
                    <label>Ano de Publicação</label>
                    <input type="number" name="ano" required>
                </div>
                <div class="input-group">
                    <label>Status</label>
                    <select name="status">
                        <option value="disponivel">Disponível</option>
                        <option value="indisponivel">Indisponível</option>
                    </select>
                </div>
                <button type="submit" class="btn-salvar">SALVAR LIVRO</button>
            </form>
        </section>
    </main>
</body>
</html>
